<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>

        body {

        .login-container {

            border-radius: 6px;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.3), inset 0 0 15px rgba(0, 242, 254, 0.1);
            padding: 40px 30px;
            box-sizing: border-box;
            text-align: center;
        }

        h2 {
            font-size: 1.8rem;
            margin: 0 0 10px 0;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 10px #00f2fe;

        .subtitle {
            font-size: 0.8rem;
            color: #4facfe;
            letter-spacing: 2px;
            margin-bottom: 30px;

        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;

            color: #a5f3fc;

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            background: #040c1a;
            border: 1px solid #4facfe;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            box-sizing: border-box;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #00f2fe;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
            background: rgba(0, 242, 254, 0.02);
        }

        button {
            background: #00f2fe;
            color: #020208;
            border: none;
            padding: 14px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            border-radius: 4px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #ffffff;
            box-shadow: 0 0 15px #ffffff;
        }

        .error-msg {
            color: #ff3b30;
            margin-top: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 59, 48, 0.4);
            display: none;
            border: 1px solid #ff3b30;
            background: rgba(255, 59, 48, 0.05);
            padding: 10px;
        }

</head>
<body>

<div class="login-container">
    <h2>Grid Sign-In</h2>
    <div class="subtitle">Secure Node Terminal Access</div>
    
    <form id="loginForm" onsubmit="return validateCredentials(event)">
        <div class="input-group">
            <label for="username">> IDENTITY HANDLE:</label>
            <input type="text" id="username" autocomplete="off" required placeholder="username">
        </div>
        <div class="input-group">
            <label for="password">> ACCESS TOKEN:</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit">Execute Handshake</button>
    </form>

    <div id="errorZone" class="error-msg">INVALID CREDENTIALS // ACCESS DENIED</div>
</div>

<script>
// Pure JavaScript SHA-256 Implementation (Bypasses HTTPS/WebCrypto restrictions)
function sha256_pure(ascii) {
    function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
    var mathPow = Math.pow, maxWord = mathPow(2, 32), result = '', words = [], asciiLength = ascii.length;
    var hash = [], k = [], primeCounter = 2, i, j;
    var isComposite = {};
    for (i = 0; primeCounter < 311; i++) {
        if (!isComposite[i]) {
            for (j = i << 1; j < 311; j += i) { isComposite[j] = true; }
            hash.push((mathPow(i, .5) * maxWord) | 0);
            k.push((mathPow(i, 1 / 3) * maxWord) | 0);
        }
        primeCounter++;
    }
    ascii += '\x80';
    while (ascii.length % 64 - 56) ascii += '\x00';
    for (i = 0; i < ascii.length; i++) {
        j = ascii.charCodeAt(i);
        if (j >> 8) return;
        words[i >> 2] |= j << ((3 - i % 4) * 8);
    }
    words[words.length] = ((asciiLength * 8) / maxWord) | 0;
    words[words.length] = (asciiLength * 8) | 0;
    for (j = 0; j < words.length; j += 16) {
        var w = words.slice(j, j + 16);
        var oldHash = hash.slice(0);
        while (w.length < 64) {
            var w15 = w[w.length - 15], w2 = w[w.length - 2];
            var s0 = rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3);
            var s1 = rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10);
            w[w.length] = (w[w.length - 16] + s0 + w[w.length - 7] + s1) | 0;
        }
        for (i = 0; i < 64; i++) {
            var h1 = hash[7], a = hash[0], e = hash[4];
            var S1 = rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25);
            var ch = (e & hash[5]) ^ (~e & hash[6]);
            var temp1 = (h1 + S1 + ch + k[i] + w[i]) | 0;
            var S0 = rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22);
            var maj = (a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]);
            var temp2 = (S0 + maj) | 0;
            hash = [(temp1 + temp2) | 0].concat(hash);
            hash[4] = (hash[4] + temp1) | 0;
            hash.length = 8;
        }
        for (i = 0; i < 8; i++) { hash[i] = (hash[i] + oldHash[i]) | 0; }
    }
    for (i = 0; i < 8; i++) {
        for (j = 3; j + 1; j--) {
            var b = (hash[i] >> (j * 8)) & 255;
            result += (b < 16 ? '0' : '') + b.toString(16);
        }
    }
    return result;
}

// Synchronous validation loop that runs identically on HTTP, HTTPS, and all browsers
function validateCredentials(event) {
    event.preventDefault(); // Stop instant page refresh
    
    const rawUser = document.getElementById('username').value.toLowerCase().trim();
    const rawPass = document.getElementById('password').value.trim();
    const errorZone = document.getElementById('errorZone');

    // Run the local pure-js hashing algorithm
    const hashedUser = sha256_pure(rawUser);
    const hashedPass = sha256_pure(rawPass);

    // Expected mathematical target signatures
    const targetUserHash = '3cd67766c10f640d621cf8bf2572dd579b5e858823301de8a836df5d076380c7'; // kyson
    const targetPassHash = 'd9851a6fd38138cae1580ce37100b43dc1d818743908aa53688323e0bffd916c'; // GridMaster77!

    if (hashedUser === targetUserHash && hashedPass === targetPassHash) {
        sessionStorage.setItem('encom_grid_auth', 'AUTHORIZED_SESSION_KEY_82');
        errorZone.style.display = 'none';
        window.location.href = 'dashboard.html';
    } else {
        errorZone.style.display = 'block';
    }
}
</script>

</body>
</html>
