<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ENCOM OS-12 // Terminal Sign-In</title>
    <style>
        body { 
            background-color: #020208; 
            color: #00f2fe; 
            font-family: 'Courier New', monospace; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 95vh; 
            margin: 0; 
        }
        .box { 
            width: 400px; 
            padding: 30px; 
            border: 2px solid #00f2fe; 
            background: rgba(4, 12, 26, 0.9); 
            text-align: center; 
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            margin-bottom: 20px;
        }
        input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 10px; 
            background: #040c1a; 
            border: 1px solid #4facfe; 
            color: #fff; 
            margin-bottom: 20px; 
            box-sizing: border-box; 
        }
        button { 
            background: #00f2fe; 
            color: #020208; 
            border: none; 
            padding: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%; 
            text-transform: uppercase; 
        }
        button:hover { 
            background: #fff; 
            box-shadow: 0 0 10px #fff; 
        }
        #debug-log { 
            width: 460px; 
            height: 150px; 
            background: #000; 
            border: 1px solid #ff0055; 
            color: #ff0055; 
            padding: 10px; 
            font-size: 11px; 
            overflow-y: scroll; 
            text-align: left; 
            box-sizing: border-box; 
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Grid Node Authentication</h2>
    <p>INTERNAL WORKSTATION ACCESS ONLY</p>
    <form onsubmit="event.preventDefault();">
        <input type="text" placeholder="IDENTITY HANDLE" readonly value="m.anager@encom.com">
        <input type="password" placeholder="ACCESS TOKEN" readonly value="*************">
        <button type="submit">Establish Handshake</button>
    </form>
</div>

<!-- Hidden/Visible Diagnostic Terminal for Lab Verification -->
<div id="debug-log">
    <strong style="color:#fff;">[SYSTEM DIAGNOSTIC LOG INITIALISED]</strong><br>
</div>

<script>
function logDebug(msg, color='#ff0055') {
    const log = document.getElementById('debug-log');
    log.innerHTML += `<span style="color:${color}">[*] ${msg}</span><br>`;
    log.scrollTop = log.scrollHeight;
}

window.onload = function() {
    logDebug("Login page components loaded successfully.", "#00f2fe");
    logDebug(`Detected URL: ${window.location.href}`, "#fff");
    
    const urlParams = new URLSearchParams(window.location.search);
    logDebug(`Parsing arguments... Total found: ${Array.from(urlParams.keys()).length}`, "#fff");
    
    if (urlParams.has('session_verify')) {
        const val = urlParams.get('session_verify');
        logDebug(`Parameter 'session_verify' value: ${val}`, "#00f2fe");
        
        if (val === 'active') {
            logDebug("Verification parameter verified! Building token footprint...", "#00f2fe");
            try {
                const targetManager = "m.anager@encom.com";
                const sessionToken = "ENCOM_SESSION_MFA_BYPASS_TOKEN_d116297d028441f7";
                const expiry = "2026-09-08 08:43:00 UTC";
                const logPayload = `[COOKIE_HARVEST] TIMESTAMP: 2026-09-07 08:43:00 UTC | USER: ${targetManager} | AUTH_TOKEN: ${sessionToken} | EXPIRY: ${expiry}\n`;
                
                // Save to LocalStorage for browser-based student forensics
                localStorage.setItem('manager_session_hijack', btoa(logPayload));
                logDebug("Successfully saved payload into LocalStorage memory cache.", "#39ff14");
                
                // Fire download trigger
                logDebug("Attempting to execute automatic browser file download...", "#fff");
                const blob = new Blob([logPayload], { type: 'text/plain' });
                const link = document.createElement('a');
                link.href = window.URL.createObjectURL(blob);
                link.download = 'stolen_cookie.txt';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                logDebug("Download instruction passed to browser layer.", "#39ff14");
                
                setTimeout(() => {
                    alert("ENCOM Core Notice: Mainframe connection profile verified. Grid status synchronized successfully.");
                }, 500);
            } catch (err) {
                logDebug(`CRITICAL JS ERROR: ${err.message}`);
            }
        } else {
            logDebug("ERROR: 'session_verify' is present but does not equal 'active'.", "#ff0055");
        }
    } else {
        logDebug("ERROR: Missing 'session_verify' URL argument completely.", "#ff0055");
    }
}
</script>

</body>
</html>
